on:
  workflow_call:
    inputs:
      runs-on:
        description: 'The runner that the job will run on'
        required: false
        type: string
      tag:
        description: 'The version tag to release'
        required: true
        type: string
      tag_major:
        description: 'The major version tag to release'
        required: false
        type: string
      tag_minor:
        description: 'The minor version tag to release'
        required: false
        type: string

permissions: write-all

concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-github-action-release
      cancel-in-progress: true

jobs:
    release-workflow:
        runs-on: wex-sandbox
        steps:
            - uses: actions/checkout@v4

            - name: Create release-notes.md file
              uses: DamianReeves/write-file-action@v1.3
              if: ${{ inputs.notes != '' }}
              with:
                path: release-notes.md
                write-mode: overwrite
                contents: ${{ inputs.notes }}
